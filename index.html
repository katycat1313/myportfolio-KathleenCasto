<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Kathleen Casto - UI/UX Designer Portfolio. Explore innovative design work through an interactive AI guide.">
    <title>Kathleen Casto — UI/UX Design Showcase</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="background-gradient" aria-hidden="true"></div>

    <main class="container">
        <div class="welcome-screen" id="welcomeScreen">
            <h1 class="welcome-title">
                <span class="gradient-text">Design Portfolio</span>
            </h1>
            <p class="welcome-subtitle">
                Let me guide you through Kathleen's UI/UX work
            </p>
            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="chat-container" id="chatContainer" aria-label="Portfolio guide chatbot">
            <div class="chat-header">
                <div class="bot-avatar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </div>
                <div class="bot-info">
                    <h2 class="bot-name">Design Guide</h2>
                    <p class="bot-status">
                        <span class="status-dot"></span>
                        Online
                    </p>
                </div>
            </div>

            <div class="messages" id="messagesContainer" role="log" aria-live="polite" aria-atomic="false">
                <!-- Messages will be added here dynamically -->
            </div>

            <div class="typing-indicator" id="typingIndicator" aria-label="Bot is typing">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="quick-replies" id="quickReplies" role="group" aria-label="Quick reply options">
                <!-- Quick reply buttons will be added here dynamically -->
            </div>

            <div class="chat-input-container">
                <label for="chatInput" class="sr-only">Type your message</label>
                <input type="text" id="chatInput" class="chat-input" placeholder="Type your message..."
                    autocomplete="off" aria-label="Message input" />
                <button id="sendButton" class="send-button" aria-label="Send message" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="project-modal" id="projectModal" role="dialog" aria-modal="true" aria-labelledby="projectTitle">
            <div class="project-modal-content">
                <button class="close-modal" id="closeModal" aria-label="Close project showcase">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
                <div id="projectContent">
                    <!-- Project content will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>Designed & Built by Kathleen Casto © 2026</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
