# Netlify Configuration for ATLAS Backend
# Deploy ATLAS as a Netlify Function

[build]
command = "npm install"
functions = "atlas-backend"
publish = "public"

[functions."atlas-backend"]
directory = "atlas-backend"
runtime = "nodejs18.x"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/server:splat"
status = 200

[[headers]]
for = "/api/*"
[headers.values]
Access-Control-Allow-Origin = "https://portfolio.smartintakesolutions.space"
Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
Access-Control-Allow-Headers = "Content-Type, Accept"
Access-Control-Allow-Credentials = "true"
